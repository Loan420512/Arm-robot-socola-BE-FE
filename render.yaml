services:
  - type: web
    name: chocorobot
    runtime: docker
    plan: free
    region: singapore
    branch: deploy
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: PORT
        value: "10000"
      - key: CHOCO_APPLY_SCHEMA
        value: "true"
      - key: PGHOST
        fromDatabase:
          name: chocorobot-db
          property: host
      - key: PGPORT
        fromDatabase:
          name: chocorobot-db
          property: port
      - key: PGUSER
        fromDatabase:
          name: chocorobot-db
          property: user
      - key: PGPASSWORD
        fromDatabase:
          name: chocorobot-db
          property: password
      - key: PGDATABASE
        fromDatabase:
          name: chocorobot-db
          property: database
      - key: Jwt__Issuer
        value: ChocoRobot.API
      - key: Jwt__Audience
        value: ChocoRobot.Admin
      - key: Jwt__Secret
        sync: false
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: Bootstrap__Username
        sync: false
      - key: Bootstrap__Password
        sync: false
      - key: Bootstrap__Email
        sync: false
